<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b6f6c"><meta name="description" content="San Martín de los Andes como maqueta de papel interactiva."><title>San Martín de los Andes en papel</title><style>html,body{margin:0;height:100%;background:#d9d2c2}</style></head><body><script type="module">// Select only a fixed, same-origin edition. Query values never become paths.
const old=new URLSearchParams(location.search).has('old');
const edition=new URL(old?'old/':'v2/cb36420ee111a81b/',location.href);
const base=document.createElement('base');base.href=edition.href;document.head.prepend(base);
document.documentElement.dataset.edition=old?'old':'v2';
try{
  const response=await fetch(new URL('index.html',edition));
  if(!response.ok)throw Error(`No se pudo cargar la página (${response.status}).`);
  const page=new DOMParser().parseFromString(await response.text(),'text/html');
  document.title=page.title;
  const styles=[];
  for(const el of page.head.querySelectorAll('style,link[rel="stylesheet"],link[rel="icon"]')){
    const node=document.importNode(el,true);
    if(node.matches('link[rel="stylesheet"]'))styles.push(new Promise((resolve,reject)=>{node.onload=resolve;node.onerror=()=>reject(Error('No se pudo cargar el estilo.'));}));
    document.head.append(node);
  }
  const map=page.head.querySelector('script[type="importmap"]');
  if(!map)throw Error('Falta el mapa de módulos.');
  const imports=document.createElement('script');imports.type='importmap';imports.textContent=map.textContent;document.head.append(imports);
  for(const script of page.body.querySelectorAll('script'))script.remove();
  document.body.replaceChildren(...[...page.body.childNodes].map(n=>document.importNode(n,true)));
  await Promise.all(styles);
  await import(new URL('page-entry.js',edition).href);
}catch(error){
  console.error(error);
  if(!document.getElementById('load-retry')){
    const message=document.createElement('p'),retry=document.createElement('button');
    message.textContent='No se pudo cargar la maqueta.';retry.textContent='Reintentar';retry.onclick=()=>location.reload();
    document.body.replaceChildren(message,retry);
  }
}
</script></body></html>
